[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-bridge"
version = "0.2.0"
description = "Herdr terminal events and human approvals through OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "psutil>=5.9; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
legacy-slack = ["slack_bolt>=1.18", "slack_sdk>=3.26"]

[project.scripts]
herdr-slackbot = "herdr_slackbot.__main__:main"
herdr-bridge = "herdr_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["herdr_bridge*", "herdr_slackbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the running Herdr server (opt-in via HERDR_LIVE_TESTS=1)",
]
