# OpenClaw supervises the bridge; no second Slack consumer is started.
id = "herdr-bridge"
name = "Herdr Bridge"
version = "0.2.0"
description = "Local Herdr agent events and human approvals through OpenClaw."
min_herdr_version = "0.8.2"
platforms = ["macos", "windows"]

[[actions]]
id = "status"
title = "Herdr Bridge: OpenClaw status"
description = "Show the gateway supervising Herdr Bridge."
command = ["openclaw", "gateway", "status"]

[[actions]]
id = "restart"
title = "Herdr Bridge: restart OpenClaw gateway"
description = "Restart the gateway and its bridge service."
command = ["openclaw", "gateway", "restart"]
